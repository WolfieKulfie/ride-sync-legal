<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride Sync — Legal</title>
<style>
  :root{--s0:#0B0B0C;--line:#26282B;--ink:#F5F5F3;--ink2:#A9ABAD;--ink3:#7F8286;--lime:#C6F000}
  *{box-sizing:border-box}
  body{margin:0;background:var(--s0);color:var(--ink);
    font:16px/1.65 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;min-height:100vh;align-items:center}
  .wrap{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:56px;width:100%}
  .brand{font:600 13px/1 system-ui,sans-serif;letter-spacing:.2em;color:var(--lime);margin:0 0 18px}
  h1{font-size:clamp(30px,6vw,42px);line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
  p{color:var(--ink2);margin:0 0 30px}
  a.row{display:flex;align-items:center;justify-content:space-between;gap:16px;
    text-decoration:none;color:var(--ink);padding:18px 20px;border:1px solid var(--line);
    border-radius:6px;margin-bottom:12px;transition:border-color .15s}
  a.row:hover,a.row:focus-visible{border-color:var(--lime);outline:none}
  a.row span{color:var(--lime);font-size:20px;line-height:1}
  .sub{display:block;color:var(--ink3);font-size:13.5px;margin-top:3px}
  .foot{margin-top:36px;font-size:13.5px;color:var(--ink3)}
  .foot a{color:var(--lime)}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">RIDE SYNC</p>
  <h1>Legal</h1>
  <p>Navigation for motorcyclists. Android, free, no ads.</p>

  <a class="row" href="./privacy.html">
    <span style="flex:1;color:inherit">Privacy policy
      <span class="sub">What is collected, why, and who sees it</span>
    </span>
    <span>&rarr;</span>
  </a>

  <a class="row" href="./delete-account.html">
    <span style="flex:1;color:inherit">Delete your account
      <span class="sub">How to remove your account and all of its data</span>
    </span>
    <span>&rarr;</span>
  </a>

  <p class="foot">
    com.ridesync.rider · <a href="mailto:revrepublic24@gmail.com">revrepublic24@gmail.com</a>
  </p>
</div>
</body>
</html>
